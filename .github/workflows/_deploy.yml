name: Deploy environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.tf.outputs.swa_url }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_sql_admin_login: ${{ vars.SQL_ADMIN_LOGIN }}
      TF_VAR_sql_admin_object_id: ${{ vars.SQL_ADMIN_OBJECT_ID }}
      TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
      TF_VAR_app_version: ${{ github.sha }}
      TF_DIR: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan

      # Bloqueante: si el costo estimado del plan supera el presupuesto, no se aplica nada.
      # Presupuesto por defecto: dev 10 USD, prod 30 USD. Se cambia con la variable COST_BUDGET_USD.
      - name: Cost gate
        env:
          COST_BUDGET_USD: ${{ vars.COST_BUDGET_USD }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform -chdir="$TF_DIR" show -json tfplan > plan.json
          python3 scripts/cost_gate.py plan.json --environment "$ENVIRONMENT"

      - name: Terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false tfplan

      - name: Read outputs
        id: tf
        run: |
          terraform -chdir="$TF_DIR" output -json > outputs.json
          for k in resource_group swa_name swa_url function_name sql_server_name sql_server_fqdn sql_database identity_name identity_client_id; do
            echo "$k=$(jq -r ".$k.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies (production only)
        working-directory: api
        run: npm ci --omit=dev

      - name: Deploy API (Azure Functions)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.tf.outputs.function_name }}
          package: api

      # La base se inicializa con el token Entra del pipeline (administrador de Azure SQL).
      # Se abre una regla de firewall temporal solo para la IP del runner.
      - name: Initialize database
        env:
          SERVER_NAME: ${{ steps.tf.outputs.sql_server_name }}
          RG: ${{ steps.tf.outputs.resource_group }}
        run: |
          IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "$RG" -s "$SERVER_NAME" -n "runner-${GITHUB_RUN_ID}" \
            --start-ip-address "$IP" --end-ip-address "$IP" >/dev/null
          trap 'az sql server firewall-rule delete -g "$RG" -s "$SERVER_NAME" -n "runner-${GITHUB_RUN_ID}" || true' EXIT
          sleep 30
          export SQL_ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$SQL_ACCESS_TOKEN"
          SQL_SERVER="${{ steps.tf.outputs.sql_server_fqdn }}" \
          SQL_DATABASE="${{ steps.tf.outputs.sql_database }}" \
          IDENTITY_NAME="${{ steps.tf.outputs.identity_name }}" \
          IDENTITY_CLIENT_ID="${{ steps.tf.outputs.identity_client_id }}" \
          node scripts/db-init.js

      - name: Get Static Web Apps deployment token
        id: token
        run: |
          T=$(az staticwebapp secrets list --name "${{ steps.tf.outputs.swa_name }}" \
            --resource-group "${{ steps.tf.outputs.resource_group }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$T"
          echo "value=$T" >> "$GITHUB_OUTPUT"

      - name: Deploy web (Static Web Apps)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true

      - name: Verify the SWA identity provider on the API
        env:
          SWA_NAME: ${{ steps.tf.outputs.swa_name }}
          RG: ${{ steps.tf.outputs.resource_group }}
          FUNC_NAME: ${{ steps.tf.outputs.function_name }}
        run: |
          FUNC_ID=$(az functionapp show -g "$RG" -n "$FUNC_NAME" --query id -o tsv)
          proveedor() {
            az rest --method get \
              --url "https://management.azure.com${FUNC_ID}/config/authsettingsV2?api-version=2022-03-01" \
              --query "properties.identityProviders.azureStaticWebApps.enabled" -o tsv
          }
          if [ "$(proveedor)" != "true" ]; then
            echo "::warning::The SWA identity provider is missing on ${FUNC_NAME}; linking the backend again"
            REGION=$(az functionapp show -g "$RG" -n "$FUNC_NAME" --query location -o tsv | tr -d ' ' | tr '[:upper:]' '[:lower:]')
            az staticwebapp backends unlink -n "$SWA_NAME" -g "$RG"
            az staticwebapp backends link -n "$SWA_NAME" -g "$RG" --backend-resource-id "$FUNC_ID" --backend-region "$REGION"
            sleep 30
          fi
          if [ "$(proveedor)" != "true" ]; then
            echo "::error::The SWA identity provider is still missing on ${FUNC_NAME}"
            exit 1
          fi
          echo "SWA identity provider enabled on ${FUNC_NAME}"

      - name: Smoke test
        env:
          SWA_URL: ${{ steps.tf.outputs.swa_url }}
          FUNC_NAME: ${{ steps.tf.outputs.function_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/smoke-test.sh

      - name: Deployment summary
        env:
          SWA_URL: ${{ steps.tf.outputs.swa_url }}
          RG: ${{ steps.tf.outputs.resource_group }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Despliegue ${ENVIRONMENT}"
            echo ""
            echo "- Sitio: ${SWA_URL}"
            echo "- Versión: \`${GITHUB_SHA::7}\`"
            echo "- Grupo de recursos: \`${RG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
